            <button onclick="clear_screen()" id="clear" style="border: 1px solid #444; color: rgb(0, 0, 0); padding: 0 12px; height: 40px; border-radius: 4px; cursor: pointer; font-weight: bold;">CLEAR SCREENS</button>

    <div id="popup-save">
        <div id="popupbox-save">
            <p>
                Save your art
                <span style="float: right; margin-bottom: 20px; margin-left: 30px;">
                    <button id="closebtn" onclick="document.getElementById('popup-save').style.display='none'">
                        X
                    </button>
                </span>
                <br>
                <br>
                <input id="inputbox" placeholder="Type your file name"><span><button id="inputsave">save</button></span>
            </p>
        </div>

    <div id="popup-shapes">
        <div id="popupbox-shapes">
            <p>
                <span style="float: right; margin-bottom: 20px; margin-left: 30px;">
                    <button id="closebtn" onclick="document.getElementById('popup-shapes').style.display='none'; mode = 'brush'">
                        X
                    </button>
                </span>
                <span>
                    <button onclick="mode = `circle`">Circle</button>
                    <button onclick="mode = `rect`">Rectangle</button>
                    <button onclick="mode = `triangle`">Triangle</button>
                    <button onclick="const arraymode = ['rect', 'triangle', 'circle']; const randomValue = arraymode[Math.floor(Math.random() * arraymode.length)]; mode = randomValue;">Random</button>
                </span>
            </p>
        </div>
    </div>

    <div id="popup-manual">
        <div id="popupbox-manual">
            <p>
                <span style="float: right; margin-bottom: 20px; margin-left: 30px;">
                    <button id="closebtn" onclick="document.getElementById('popup-manual').style.display='none'; mode = 'brush'">
                        X
                    </button>
                </span>
                <br>
                <span>
                    <br>
                    <h2>Ctrl y = redo</b2>
                    <h2>Ctrl z = undo</h2>
                    <h2>Ctrl x = save image</b2>
                    <h2>Ctrl a = shapes</h2>
                    <h2>Ctrl 1 = zen mode</b2>
                    <h2>Ctrl m = manual/keywords</h2>
                    <h2>Ctrl 2 = deactivate zen mode</b2>
