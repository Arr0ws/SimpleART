<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <link href="https://fonts.cdnfonts.com/css/vhs-gothic" rel="stylesheet">
    <style>
        body {
            background-color: rgb(44, 44, 44);
            font-family: Arial, Helvetica, sans-serif;
        }

        canvas {
            margin: 32px;
        }

        button {
            font-size: x-large;
            border-radius: 10px;
        }

        #bigtext {
            color: rgb(0, 0, 0);
            font-family: 'VHS Gothic', sans-serif;
        }

        .canvas-wrapper {
            display: flex;
            height: 100vh;
        }

        #popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;  
            background: rgba(0,0,0,0.5);

            display: none;
            align-items: center;
            justify-content: center;
        }

        #popup-box {
            background: white;
            padding: 20px;
            width: 500px;
            border-radius: 10px;
        }

        #popup-color {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;  
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
        }

        #popupbox-color {
            background: white;
            padding: 20px;
            width: 500px; 
            border-radius: 10px;
        }

        #popup-save {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;  
            background: rgba(0,0,0,0.5);

            display: none;
            align-items: center;
            justify-content: center;
        }

        #popupbox-save {
            background: white;
            padding: 20px;
            width: 500px;
            border-radius: 10px;
        }

        #popup-command {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;  
            background: rgba(0,0,0,0.5);

            display: none;
            align-items: center;
            justify-content: center;
        }

        #popupbox-command {
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        button {
            border: 1px solid black;
        }
    </style>
</head>
<body>

    <h1 id="bigtext" style="background-color: rgb(255, 255, 255); border-radius: 8px; padding: 6px; display: inline-block;">
        SimpleART (Alpha 3.0)
    </h1>
    <!--
    <input type="color" id="favcolor" name="favcolor" value="#ff0000">
    -->

    <div id="hideornah" >

        

        <div style="background-color: rgb(26, 26, 26); gap: 30px; padding: 7px; border-radius: 6px; display: inline-flex;">
            
            <button id="Eraser">🧽</button>
            <button id="Normal">🖌️</button>
            <button id="pixel">👾</button>
            <button id="Paint">🪣</button>
            <button id="brushpickcolor">🎨</button>
            <button id="text">TEXT</button>
            <button id="shapes">SHAPES</button>

        </div>

        <div id="hideornah" style="float: right; position: absolute; top: 10px; right: 10px; background-color: rgb(26, 26, 26); color: white; font-size: x-large;">
            <h2 style="font-size: 40px;">( Size )</h2>

            <span>
                <h2 id="score">20</h2>
            </span>

            <span style="float: right; margin-left: 10px;">
                <input type="range" id="volume" name="volume" min="0" max="100" value="50" oninput="slider()">
            </span>

            <span>
                <h2 style="font-size: 40px;">( Clear )</h2>
            </span>

            <span>
                <h2 id="scoreclear">20</h2>
            </span>

            <span style="float: right; margin-left: 10px;">
                <input type="range" id="volume" name="volume" min="0" max="100" value="50" oninput="sliderclear()">
            </span>

            <span>
                <h2 style="font-size: 40px;">( Thick )</h2>
            </span>

            <span>
                <h2 id="scorethick">20</h2>
            </span>

            <span style="float: right; margin-left: 10px;">
                <input type="range" id="volume1" name="volume" min="0" max="100" value="50" oninput="sliderclear()">
            </span>

        </div>


    </div>

    </div>

    <div id="popup-save">
        <div id="popupbox-save">
            <p>
                Save your art

                    <button id="closebtn" onclick="document.getElementById('popup-save').style.display='none'">
